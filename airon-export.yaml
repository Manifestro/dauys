# airon-export.yaml: the best DY-41 weights so far as a private HF model repo (manifestro/dauys-dy41-mimi-lm),
# with the model code, inference.py, README and a spoken sample; checked by a fresh download. No training.
#   airon launch airon-export.yaml

experiment: DY-41

resources:
  gpu: g5.xlarge                   # A10G: one 10 s continuation for the check
  disk: 100                        # the machine image alone takes 75
  ttl: 2h
  wait: 1h

stages:
  setup: bash scripts/dy41_job.sh setup
  train: bash scripts/dy41_job.sh export s3://airon-checkpoints-876108973178/dauys/DY-41/24/step-000025838-a1/last.pt

datasets: [duplexchat-en16k]

metrics: {primary: eval/loss, goal: min}   # the experiment's primary; this job only exports

on_fail: {hold: 30m}
quiet_ok: 30m
