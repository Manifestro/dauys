# airon-pass.yaml: step 1 of DY-41, the Mimi pass split over A10G machines (airon shards).
#   airon launch airon-pass.yaml       then, once every shard is done:   airon launch   (airon.yaml, training)
# Each machine encodes its part (every n-th) of the en-16k training shards not yet in S3 (outputs/dauys/dy40/units/).

experiment: DY-41

resources:
  gpu: g5.2xlarge                  # A10G 24 GB, 32 GB RAM; one worker ~900x realtime
  disk: 150
  ttl: 4h
  wait: 1h
  shards: 12

stages:
  setup: bash scripts/dy41_job.sh setup
  train: bash scripts/dy41_job.sh pass 1 --batch 2 --chunk-s 60   # A10G 24 GB: batch 8 x 120 s ran out of GPU memory

datasets: [duplexchat-en16k]

on_fail: {hold: 30m}
quiet_ok: 30m
