# DY-42 step 2: Whisper large-v3-turbo transcripts of the ~600k utterances past DY-41/34's 200k (reused), one RTX PRO
# 6000 each, split over 4 machines (one did ~47 utterances/s: 1 h 45 min); kept as the dataset dy42-whisper-texts. Transcripts are the head's training target only.
experiment: DY-42
type: run
gpu: g7e.4xlarge
shards: 4
disk: 100
ttl: 2h
dry: bash scripts/dy42_job.sh texts --limit 300
run: bash scripts/dy42_job.sh texts
result:
  dataset: dy42-whisper-texts
